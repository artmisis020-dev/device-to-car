<!DOCTYPE html>
<html>
<head>
    <title>Sirena Camera — Unavailable</title>
    <meta http-equiv="refresh" content="10">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111; display:flex; justify-content:center; align-items:center;
               height:100vh; flex-direction:column; gap:16px; }
        .msg { color:#f44; font:18px monospace; background:rgba(0,0,0,.6);
               padding:12px 24px; border-radius:6px; border:1px solid #f44; }
        .dev { color:#888; font:12px monospace; }
        .note { color:#666; font:11px monospace; }
    </style>
</head>
<body>
    <div class="msg">&#9888; Camera unavailable</div>
    <div class="dev">{device_path}</div>
    <div class="note">page auto-refreshes every 10s</div>
</body>
</html>
