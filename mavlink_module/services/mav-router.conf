Baud = 115200

[UdpEndpoint companion]
Mode = normal
Address = 127.0.0.1
Port = 14551
RetryConnect = true

[UdpEndpoint navigation_service]
Mode = normal
Address = 127.0.0.1
Port = 14553

[UdpEndpoint telemetry_publisher]
Mode = normal
Address = 127.0.0.1
Port = 14562

[UdpEndpoint fire_device_status]
Mode = normal
Address = 127.0.0.1
Port = 14564

[UdpEndpoint admin_control]
Mode = server
Address = 0.0.0.0
Port = 14567

# Сирий MAVLink на Spark для інерційки (vision_module/inertia/README.md):
# адмін-сервер socat-ом пересилає 10.0.0.1:14570 → Spark mavlink_udp_logger.py.
[UdpEndpoint spark_relay]
Mode = normal
Address = 10.0.0.1
Port = 14570
