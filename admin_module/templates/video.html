{% extends "base.html" %}
{% block title %}Video - {{ hostname }}{% endblock %}
{% block head %}
<style>
  body {
    background: #0d1117;
    color: #c9d1d9;
  }

  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
  }

  .card-header {
    background: #1c2128 !important;
    border-bottom: 1px solid #21262d;
    color: #c9d1d9 !important;
    padding: .6rem 1rem;
    font-size: .85rem;
    font-weight: 600;
  }

  #videoWrap {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 4/3;
  }

  #webrtcFrame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
  }

  #videoOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }

  .rec-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #d73a49;
    display: inline-block;
    animation: blink 1s infinite;
  }

  @keyframes blink {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: .2
    }
  }

  .file-row td {
    vertical-align: middle;
    font-size: .82rem;
    padding: .35rem .5rem !important;
    border-color: #21262d !important;
  }

  .file-row:hover {
    background: rgba(30, 58, 95, .3) !important;
  }

  .navbar {
    background: #161b22 !important;
    border-bottom: 1px solid #21262d;
  }
</style>
{% endblock %}
{% block content %}
<nav class="navbar navbar-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand">{{ hostname }} - Video</span>
    <div class="d-flex gap-2">
      <button id="btnRecord" class="btn btn-sm btn-success" onclick="toggleRecord()">Start Recording</button>
      <a href="/" class="btn btn-sm btn-outline-secondary">Back</a>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <iframe id="video-frame" style="width: 100%; height: 500px; border: none;" allow="autoplay; fullscreen">
  </iframe>

</div>
{% endblock %}

{% block scripts %}
{{ super() }}

<script>
  const deviceId = "{{ device_id }}";

  fetch(`/api/video/${deviceId}/stream`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("video-frame").src = data.stream_url;
    });
</script>
