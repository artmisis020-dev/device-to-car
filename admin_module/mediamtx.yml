log:
  level: info
  format: text
  output: stdout
api:
  enabled: true
  address: 127.0.0.1:9997
  
rtsp:
  enabled: true
  address: 0.0.0.0
  port: 8554
  transportProtocols: [tcp, udp]

srt:
  enabled: true
  address: :8890


