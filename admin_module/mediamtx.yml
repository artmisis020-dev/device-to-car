logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

srt: yes
srtAddress: :8890

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Runtime deploy can replace this from MEDIAMTX_ADDITIONAL_HOSTS.
webrtcAdditionalHosts: []

hls: no
rtmp: no

paths:
  all_others:
    source: publisher
