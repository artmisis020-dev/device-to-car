name: Manual Flask Deployment

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment (optional)'
        required: false
        default: 'Manual server update'
      branch:
        description: 'Git branch to deploy'
        required: false
        default: 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r admin_module/requirements.txt

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Generate secret key
        id: gen_key
        run: echo "value=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_OUTPUT

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_SIRENA_DB: ${{ secrets.SIRENA_DB }}
          envkey_SIRENA_RECORDINGS: ${{ secrets.SIRENA_RECORDINGS }}
          envkey_SIRENA_SECRET_KEY: ${{ steps.gen_key.outputs.value }}
          envkey_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          envkey_WEBRTC_PROXY_UPSTREAM: ${{ secrets.WEBRTC_PROXY_UPSTREAM }}
          envkey_WEBRTC_PROXY_TIMEOUT_S: ${{ secrets.WEBRTC_PROXY_TIMEOUT_S }}
          envkey_MEDIAMTX_WEBRTC_PUBLIC_URL: ${{ secrets.MEDIAMTX_WEBRTC_PUBLIC_URL }}
          file_name: .env

      - name: Ensure app directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/sirena-admin

      - name: Copy .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .env
          target: /opt/sirena-admin/

      - name: Execute Remote Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REASON: ${{ github.event.inputs.reason }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_REASON,DEPLOY_BRANCH
          script: |
            set -Eeuo pipefail
            echo "Start Deployment. Reason: $DEPLOY_REASON"
            APP_DIR="/opt/sirena-admin"
            REPO_URL="https://github.com/artmisis020-dev/device-to-car.git"
            BRANCH="${DEPLOY_BRANCH:-main}"
            DEPLOY_SCRIPT="$APP_DIR/admin_module/deploy/deploy.sh"
            ENV_BACKUP="/tmp/sirena-admin.env"

            if sudo test -f "$APP_DIR/.env"; then
              sudo cp "$APP_DIR/.env" "$ENV_BACKUP"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Bootstrap: cloning repository for first deploy"
              sudo rm -rf "$APP_DIR"
              sudo git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            if sudo test -f "$ENV_BACKUP"; then
              sudo mv "$ENV_BACKUP" "$APP_DIR/.env"
            fi

            echo "Syncing repository to latest $BRANCH"
            REPO_OWNER="$(stat -c '%U' "$APP_DIR")"
            echo "Repository owner: $REPO_OWNER"

            sudo -u "$REPO_OWNER" -H git -C "$APP_DIR" fetch origin "$BRANCH"
            sudo -u "$REPO_OWNER" -H git -C "$APP_DIR" reset --hard "origin/$BRANCH"

            if ! sudo test -f "$DEPLOY_SCRIPT"; then
              echo "Deploy script not found at $DEPLOY_SCRIPT" >&2
              exit 1
            fi

            sudo bash "$DEPLOY_SCRIPT"
